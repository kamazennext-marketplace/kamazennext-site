deployment:
  tasks:
    - export DEPLOYPATH=/home2/kamazennext/public_html/
    - /bin/echo "Deploying to: $DEPLOYPATH"
    - if [ -d "$DEPLOYPATH/public_html" ]; then mv "$DEPLOYPATH/public_html" "$DEPLOYPATH/__trash_public_html_$(date +%Y%m%d%H%M%S)"; fi
    - if [ -d "$DEPLOYPATH/home2" ]; then mv "$DEPLOYPATH/home2" "$DEPLOYPATH/__trash_home2_$(date +%Y%m%d%H%M%S)"; fi
    - /usr/bin/rsync -avh --delete public_html/ "$DEPLOYPATH"
    - test -f "$DEPLOYPATH/kzn-health.txt" && /bin/echo "OK: kzn-health deployed" || ( /bin/echo "ERROR: kzn-health missing" && exit 1 )
    - test -f "$DEPLOYPATH/marketplace/test.txt" && /bin/echo "OK: marketplace test deployed" || ( /bin/echo "ERROR: marketplace test missing" && exit 1 )
