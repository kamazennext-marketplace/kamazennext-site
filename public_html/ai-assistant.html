<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant - Kama ZenNext</title>
  <link rel="stylesheet" href="/assets/css/main-dark.css?v=4">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/assets/js/header.js?v=3" defer></script>
  <script src="/assets/js/mobile-nav.js?v=3" defer></script>

  <script src="/assets/js/security.js?v=3"></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container" style="max-width: 900px;">
      <h1 class="text-gradient">AI Assistant</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 32px;">Ask questions about AI products,
        comparisons, or how to get the most from Kama ZenNext.</p>

      <div class="card" style="min-height: 400px; display: flex; flex-direction: column;">
        <div class="chat-response-area" id="response">
          <div class="chat-message">
            <i class="fas fa-robot chat-icon bot"></i>
            <div>
              <strong style="color: var(--text-main);">Kama AI</strong>
              <p class="chat-message-content" style="background: transparent; padding: 0;">Hello! I can help you find
                the best software tools, compare features, or answer questions about our marketplace. What's on your
                mind?</p>
            </div>
          </div>
        </div>

        <div style="position: relative;">
          <textarea id="question" class="form-control"
            placeholder="Ask me to suggest tools, compare options, or summarize a product..."></textarea>
          <button id="askBtn" class="btn btn-primary" style="margin-top: 16px; width: 100%;">
            <i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Ask AI
          </button>
        </div>
        <small
          style="color: var(--text-muted); display:block; margin-top:12px; text-align: center; font-size: 0.8rem;">Responses
          may include AI-generated content.</small>
      </div>
    </div>
  </main>

  <script>
    const questionInput = document.getElementById('question');
    const responseBox = document.getElementById('response');
    const askBtn = document.getElementById('askBtn');

    const appendUserMessage = (msg) => {
      const div = document.createElement('div');
      div.className = "chat-message user";
      div.innerHTML = `
        <div style="text-align: right;">
          <strong style="color: var(--text-main);">You</strong>
          <p class="chat-message-content">${msg.replace(/</g, '&lt;')}</p>
        </div>
        <i class="fas fa-user-circle chat-icon user"></i>
      `;
      responseBox.appendChild(div);
      responseBox.scrollTop = responseBox.scrollHeight;
      // Clear previous bot waiting message if any
      const existingWait = document.getElementById('bot-waiting');
      if (existingWait) existingWait.remove();
    };

    const appendBotMessage = (msg, isWaiting = false) => {
      const div = document.createElement('div');
      if (isWaiting) div.id = 'bot-waiting';
      div.className = "chat-message";
      div.innerHTML = `
        <i class="fas fa-robot chat-icon bot"></i>
        <div>
          <strong style="color: var(--text-main);">Kama AI</strong>
          <p class="chat-message-content" style="background: transparent; padding: 0;">${msg}</p>
        </div>
      `;
      responseBox.appendChild(div);
      responseBox.scrollTop = responseBox.scrollHeight;
    };

    const ask = async () => {
      const question = questionInput.value.trim();
      if (!question) return;

      appendUserMessage(question);
      questionInput.value = '';
      appendBotMessage('Thinking...', true);

      try {
        const res = await fetch('/api/ask-open.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question })
        });
        const data = await res.json();

        // Remove waiting message
        const waiting = document.getElementById('bot-waiting');
        if (waiting) waiting.remove();

        if (data.reply) {
          appendBotMessage(data.reply.replace(/\n/g, '<br>'));
        } else {
          appendBotMessage('Sorry, I encountered an issue getting a response.');
        }
      } catch (err) {
        const waiting = document.getElementById('bot-waiting');
        if (waiting) waiting.remove();
        appendBotMessage('Connection issue. Please check your internet and try again.');
      }
    };

    askBtn.addEventListener('click', ask);

    // Allow Enter key to submit
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });
  </script>
  <script type="module">
    import { injectBaseSchema } from '/assets/js/seo-schema.js';
    const siteUrl = window.location.origin;
    injectBaseSchema({
      siteName: 'Kama ZenNext',
      siteUrl,
      logoUrl: `${siteUrl}/assets/favicon.svg`
    });
  </script>
</body>

</html>
