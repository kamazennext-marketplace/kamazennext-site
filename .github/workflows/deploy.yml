name: Deploy to cPanel via FTP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public_html/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.cpanel.yml
            public_html_clean/**
            openai_config.example.php

      - name: Verify deployed marker
        run: |
          if curl -fsS https://kamazennext.com/kzn-health.txt | grep -q "KZN ROOT OK"; then
            echo "kzn-health.txt OK"
          else
            echo "kzn-health.txt MISSING"
          fi
